<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <title>Feedback Form</title>
</head>
<body>
    <header>
        <h1>We'd Love to Hear from You</h1>
        <h2>Please fill out the form below</h2>
    </header>
    <form action="/submit" method="post">
        <fieldset>
            <legend>User Information<span style="color: #e00;" aria-label="required">*</span></legend>
            <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required><br>
            <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@example.com" required><br>
            <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Minimum of 8 characters" minlength="8"><br>
        </fieldset>
        <fieldset>
            <legend>Feedback<span style="color: #e00;" aria-label="required">*</span></legend>
            <label for="feedback">Feedback Category:</label>
                <select id="feedback" name="feedback" required>
                    <option value="" disabled selected>-- Select a Feedback Type --</option>
                    <option value="positive">Positive</option>
                    <option value="negative">Negative</option>
                    <option value="neutral">Neutral</option>
                </select><br>
            <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="50" placeholder="Write your message here" required></textarea>
        </fieldset>
        <fieldset>
            <legend>Additional Features of Interest:</legend>
                <label for="completion-tracking">
                    <input type="checkbox" id="completion-tracking" name="feature" value="completion-tracking"> Completion-Tracking
                 </label>
                <label for="color-isolation">
                    <input type="checkbox" id="color-isolation" name="feature" value="color-isolation"> Color-Isolation
                </label>
                <label for="progress-saving">
                    <input type="checkbox" id="progress-saving" name="feature" value="progress-saving"> Progress-Saving
                </label>
        </fieldset>
        <fieldset>
            <legend>Preferred Contact Method:<span style="color: #e00;" aria-label="required">*</span></legend>
            <label for="email">
                <input type="radio" id="email" name="contact" value="email" required>Email
            </label>
            <label for="phone">
                <input type="radio" id="phone" name="contact" value="phone">Phone
            </label>
            <label for="paper-mail">
                <input type="radio" id="paper-mail" name="contact" value="paper-mail"> Paper Mail
            </label>
        </fieldset><br>
        <input type="submit" value="Submit" class="submit-btn">
    </form>
</body>
</html>
